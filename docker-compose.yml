services:
  backend:
    build: ./backend
    env_file:
      - .env
    environment:
      ENVIRONMENT: production
      DATABASE_URL: sqlite:////data/pme_threats.db
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      - threat_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "3000:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  threat_data:
